[project]
name = "video-generator"
version = "0.1.0"
description = "Local text-to-video and image-to-video HTTP API for Apple Silicon Macs, powered by LTX-Video and Hugging Face diffusers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = [
    "accelerate>=1.2",
    "diffusers>=0.34",
    "fastapi>=0.115",
    "huggingface-hub>=0.30",
    "imageio>=2.36",
    "imageio-ffmpeg>=0.5",
    "pillow>=10.4",
    "protobuf>=5",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.18",
    "sentencepiece>=0.2",
    "torch>=2.6",
    "transformers>=4.48",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pyright]
venvPath = "."
venv = ".venv"
