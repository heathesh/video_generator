[project]
name = "video-generator"
version = "0.1.0"
description = "Local text-to-video and image-to-video HTTP API for Apple Silicon Macs, powered by LTX-Video and Hugging Face diffusers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = [
    "accelerate>=1.2",
    "diffusers>=0.34",
    "fastapi>=0.115",
    "huggingface-hub>=0.30",
    "imageio>=2.36",
    "imageio-ffmpeg>=0.5",
    "pillow>=10.4",
    "protobuf>=5",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.18",
    "sentencepiece>=0.2",
    "torch>=2.6",
    "transformers>=4.48",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
# Audio backends, installed by `make setup-audio` for the one you choose. stable-audio needs nothing extra.
mmaudio = [
    "mmaudio",
    "torchvision>=0.29.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.uv]
# The mmaudio extra pins numpy<2.1 and pulls in gradio/tensorboard for its demo and training code. Inference works with
# numpy 2, and the demo/training extras are dropped (the never-matching marker removes them).
override-dependencies = [
    "numpy>=2",
    "gradio; sys_platform == 'never'",
    "tensorboard; sys_platform == 'never'",
]

[tool.uv.sources]
mmaudio = { git = "https://github.com/hkchengrex/MMAudio", rev = "974010a026c731054592d8f777218bd9d85a6c24" }
